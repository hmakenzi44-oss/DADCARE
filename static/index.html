<!DOCTYPE html>
<html lang="sw" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
  <meta name="theme-color" content="#0B0D1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="index,follow">
  <title>DADCARE — Mfumo wa Biashara</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div id="main-content" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center">
      <div style="font-size:42px;font-weight:900;background:linear-gradient(135deg,#5B6EF5,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.04em">DADCARE</div>
      <div style="margin-top:16px"><div class="spinner"></div></div>
    </div>
  </div>

  <div id="toast-root"></div>

  <!-- Core -->
  <script src="/static/js/core.js"></script>

  <!-- Pages -->
  <script src="/static/js/pages/auth.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/products.js"></script>
  <script src="/static/js/pages/pos.js"></script>
  <script src="/static/js/pages/sales.js"></script>
  <script src="/static/js/pages/more.js"></script>
  <script src="/static/js/pages/staff.js"></script>
  <script src="/static/js/pages/settings.js"></script>

  <script>
    // PWA Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
