<!DOCTYPE html>
<html lang="sw" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="theme-color" content="#0F0E1A">
  <meta name="description" content="DADCARE — Business Ecosystem for East and Southern Africa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DADCARE">
  <title>{% block title %}DADCARE{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/main.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <div class="page">
        <div class="empty" style="min-height:100vh">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/pages.js"></script>
  {% block extra_scripts %}{% endblock %}

  <script>
    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
          .catch(e => console.warn('SW registration failed:', e));
      });
    }
  </script>
</body>
</html>
